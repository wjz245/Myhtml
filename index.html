<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">项目导览</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' id='favicon'>📚</text></svg>">
  <style>
    :root {
      --surface-0: #05070C;
      --surface-1: #0A0D12;
      --surface-2: #0F131C;
      --surface-3: #161D2B;
      --surface-4: #1E2636;
      --accent: #38BDF8;
      --accent-dim: #1E3A5F;
      --text-primary: #E5E7EB;
      --text-secondary: #9CA3AF;
      --text-tertiary: #6B7280;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", monospace;

      --radius-full: 999px;
      --radius-lg: 16px;
      --radius-md: 12px;

      --space-xs: clamp(0.5rem, 1vw, 0.75rem);
      --space-sm: clamp(0.75rem, 1.5vw, 1rem);
      --space-md: clamp(1rem, 2vw, 1.5rem);
      --space-lg: clamp(1.5rem, 3vw, 2.5rem);
      --space-xl: clamp(2rem, 4vw, 4rem);

      color-scheme: dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: var(--surface-0);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-md);
    }

    header {
      margin-bottom: var(--space-xl);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-sm);
      background: linear-gradient(135deg, var(--text-primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--text-secondary);
      font-weight: 400;
    }

    .search-bar {
      background: var(--surface-2);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius-full);
      padding: var(--space-sm) var(--space-md);
      font-size: 1rem;
      color: var(--text-primary);
      font-family: var(--font-sans);
      width: 100%;
      max-width: 600px;
      margin-bottom: var(--space-lg);
      transition: all 0.2s;
    }

    .search-bar:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface-3);
    }

    .category {
      margin-bottom: var(--space-xl);
    }

    .category-header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--surface-3);
    }

    .category-title {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .category-count {
      font-size: 0.875rem;
      color: var(--text-tertiary);
      background: var(--surface-3);
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      font-family: var(--font-mono);
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-md);
    }

    .item-card {
      background: var(--surface-2);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .item-card:hover {
      background: var(--surface-3);
      border-color: var(--accent-dim);
      transform: translateY(-2px);
    }

    .item-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--space-xs);
    }

    .item-description {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      flex-grow: 1;
      line-height: 1.5;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      align-items: center;
      font-size: 0.8125rem;
      color: var(--text-tertiary);
      padding-top: var(--space-xs);
      border-top: 1px solid var(--surface-3);
    }

    .item-date {
      font-family: var(--font-mono);
    }

    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-left: auto;
    }

    .tag {
      background: var(--accent-dim);
      color: var(--accent);
      padding: 0.125rem 0.625rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: var(--space-xl);
      color: var(--text-tertiary);
      font-size: 1.125rem;
    }

    @media (max-width: 768px) {
      .items-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="siteTitle">项目导览</h1>
      <p class="subtitle" id="siteDescription">按类别浏览所有文档</p>
    </header>

    <input
      type="text"
      class="search-bar"
      id="searchInput"
      placeholder="搜索标题、描述或标签..."
    >

    <div id="content"></div>
  </div>

  <script>
    let allData = [];
    let siteConfig = {};

    async function loadSiteConfig() {
      try {
        const response = await fetch('site.json');
        siteConfig = await response.json();

        // 更新页面标题和图标
        document.getElementById('pageTitle').textContent = siteConfig.title || '项目导览';
        document.getElementById('siteTitle').textContent = `${siteConfig.icon || '📚'} ${siteConfig.title || '项目导览'}`;
        document.getElementById('siteDescription').textContent = siteConfig.description || '按类别浏览所有文档';

        // 更新主题色
        if (siteConfig.theme) {
          const root = document.documentElement;
          if (siteConfig.theme.accent) {
            root.style.setProperty('--accent', siteConfig.theme.accent);
          }
          if (siteConfig.theme.accentMuted) {
            root.style.setProperty('--accent-dim', siteConfig.theme.accentMuted);
          }
        }

        // 更新 favicon
        if (siteConfig.icon) {
          const favicon = document.querySelector('link[rel="icon"]');
          favicon.href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>${siteConfig.icon}</text></svg>`;
        }
      } catch (error) {
        console.warn('未找到 site.json，使用默认配置');
      }
    }

    async function loadData() {
      try {
        const response = await fetch('data.json');
        allData = await response.json();
        renderContent(allData);
      } catch (error) {
        document.getElementById('content').innerHTML =
          '<div class="empty-state">加载数据失败，请确保运行了构建脚本</div>';
      }
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }

    function renderContent(data) {
      const container = document.getElementById('content');

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无内容</div>';
        return;
      }

      container.innerHTML = data.map(category => `
        <div class="category">
          <div class="category-header">
            <h2 class="category-title">${category.name}</h2>
            <span class="category-count">${category.items.length} 项</span>
          </div>
          <div class="items-grid">
            ${category.items.map(item => `
              <a href="${item.path}" class="item-card">
                <h3 class="item-title">${item.title}</h3>
                ${item.description ? `<p class="item-description">${item.description}</p>` : ''}
                <div class="item-meta">
                  <span class="item-date">${formatDate(item.modified)}</span>
                  ${item.tags.length > 0 ? `
                    <div class="item-tags">
                      ${item.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                  ` : ''}
                </div>
              </a>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function filterContent(searchTerm) {
      if (!searchTerm.trim()) {
        renderContent(allData);
        return;
      }

      const term = searchTerm.toLowerCase();
      const filtered = allData.map(category => ({
        name: category.name,
        items: category.items.filter(item =>
          item.title.toLowerCase().includes(term) ||
          item.description.toLowerCase().includes(term) ||
          item.tags.some(tag => tag.toLowerCase().includes(term)) ||
          category.name.toLowerCase().includes(term)
        )
      })).filter(category => category.items.length > 0);

      renderContent(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      filterContent(e.target.value);
    });

    // 初始化
    (async () => {
      await loadSiteConfig();
      await loadData();
    })();
  </script>
</body>
</html>
