<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">项目导览</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
    :root {
      --surface-0: #05070C;
      --surface-1: #0A0D12;
      --surface-2: #0F131C;
      --surface-3: #161D2B;
      --surface-4: #1E2636;
      --accent: #38BDF8;
      --accent-dim: #1E3A5F;
      --text-primary: #E5E7EB;
      --text-secondary: #9CA3AF;
      --text-tertiary: #6B7280;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --font-mono: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", monospace;

      --radius-full: 999px;
      --radius-lg: 16px;
      --radius-md: 12px;

      --space-xs: clamp(0.5rem, 1vw, 0.75rem);
      --space-sm: clamp(0.75rem, 1.5vw, 1rem);
      --space-md: clamp(1rem, 2vw, 1.5rem);
      --space-lg: clamp(1.5rem, 3vw, 2.5rem);
      --space-xl: clamp(2rem, 4vw, 4rem);

      color-scheme: dark;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background: var(--surface-0);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-md);
    }

    header {
      margin-bottom: var(--space-xl);
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: var(--space-sm);
      background: linear-gradient(135deg, var(--text-primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: var(--text-secondary);
      font-weight: 400;
    }

    .search-bar {
      background: var(--surface-2);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius-full);
      padding: var(--space-sm) var(--space-md);
      font-size: 1rem;
      color: var(--text-primary);
      font-family: var(--font-sans);
      width: 100%;
      max-width: 600px;
      margin-bottom: var(--space-lg);
      transition: all 0.2s;
    }

    .search-bar:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--surface-3);
    }

    .category {
      margin-bottom: var(--space-xl);
    }

    .category-header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: var(--space-md);
      margin-bottom: var(--space-md);
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--surface-3);
    }

    .category-title {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .category-count {
      font-size: 0.875rem;
      color: var(--text-tertiary);
      background: var(--surface-3);
      padding: 0.25rem 0.75rem;
      border-radius: var(--radius-full);
      font-family: var(--font-mono);
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-md);
    }

    .item-card {
      background: var(--surface-2);
      border: 1px solid var(--surface-3);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .item-card:hover {
      background: var(--surface-3);
      border-color: var(--accent-dim);
      transform: translateY(-2px);
    }

    .item-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--space-xs);
    }

    .item-description {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      flex-grow: 1;
      line-height: 1.5;
    }

    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      align-items: center;
      font-size: 0.8125rem;
      color: var(--text-tertiary);
      padding-top: var(--space-xs);
      border-top: 1px solid var(--surface-3);
    }

    .item-date {
      font-family: var(--font-mono);
    }

    .item-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-left: auto;
    }

    .tag {
      background: rgba(56, 189, 248, 0.15);
      color: rgba(56, 189, 248, 0.95);
      padding: 0.125rem 0.625rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-family: var(--font-mono);
      font-weight: 500;
    }

    .pin-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.25rem;
      height: 1.25rem;
      color: #F59E0B;
      font-size: 0.875rem;
      margin-right: 0.375rem;
    }

    .item-card.pinned {
      border-color: rgba(245, 158, 11, 0.3);
      background: linear-gradient(135deg, var(--surface-2), rgba(245, 158, 11, 0.03));
    }

    .no-results {
      text-align: center;
      padding: var(--space-xl);
      color: var(--text-tertiary);
      font-size: 1.125rem;
    }

    @media (max-width: 768px) {
      .items-grid {
        grid-template-columns: 1fr;
      }

      .category-header {
        grid-template-columns: 1fr;
      }

      .item-tags {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="siteTitle">项目导览</h1>
      <p class="subtitle" id="siteSubtitle">探索知识的奇妙旅程</p>
    </header>

    <input
      type="text"
      class="search-bar"
      id="searchInput"
      placeholder="搜索项目、标签或描述..."
      autocomplete="off"
    >

    <div id="content"></div>
  </div>

  <script>
    let allData = [];
    let searchTerm = '';

    async function loadConfig() {
      try {
        const response = await fetch('site.json');
        const config = await response.json();
        document.getElementById('pageTitle').textContent = config.title;
        document.getElementById('siteTitle').textContent = config.title;
        document.getElementById('siteSubtitle').textContent = config.description;
        if (config.searchPlaceholder) {
          document.querySelector('.search-bar').placeholder = config.searchPlaceholder;
        }

        const favicon = document.querySelector('link[rel="icon"]');
        if (config.icon) {
          favicon.href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>${config.icon}</text></svg>`;
        }
      } catch (e) {
        console.log('No site.json found, using defaults');
      }
    }

    async function loadData() {
      try {
        const response = await fetch('data.json');
        allData = await response.json();
        renderCategories(allData);
      } catch (error) {
        console.error('Failed to load data:', error);
        document.getElementById('content').innerHTML =
          '<div class="no-results">数据加载失败</div>';
      }
    }

    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).replace(/\//g, '-');
    }

    function renderCategories(categories) {
      const content = document.getElementById('content');

      if (!categories || categories.length === 0) {
        content.innerHTML = '<div class="no-results">暂无内容</div>';
        return;
      }

      const filteredCategories = categories
        .map(cat => ({
          ...cat,
          items: cat.items.filter(item => matchesSearch(item))
        }))
        .filter(cat => cat.items.length > 0);

      if (filteredCategories.length === 0) {
        content.innerHTML = '<div class="no-results">未找到匹配的内容</div>';
        return;
      }

      content.innerHTML = filteredCategories.map(category => `
        <div class="category">
          <div class="category-header">
            <h2 class="category-title">${category.name}</h2>
            <span class="category-count">${category.items.length} 项</span>
          </div>
          <div class="items-grid">
            ${category.items.map(item => `
              <a href="${item.path}" class="item-card${item.pinned ? ' pinned' : ''}">
                <div class="item-title">
                  ${item.pinned ? '<span class="pin-icon">📌</span>' : ''}${item.title}
                </div>
                ${item.description ? `<div class="item-description">${item.description}</div>` : ''}
                <div class="item-meta">
                  <span class="item-date">${formatDate(item.modified)}</span>
                  ${item.tags && item.tags.length > 0 ? `
                    <div class="item-tags">
                      ${item.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                    </div>
                  ` : ''}
                </div>
              </a>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function matchesSearch(item) {
      if (!searchTerm) return true;

      const term = searchTerm.toLowerCase();
      const searchableText = [
        item.title,
        item.description,
        ...(item.tags || [])
      ].join(' ').toLowerCase();

      return searchableText.includes(term);
    }

    function handleSearch(event) {
      searchTerm = event.target.value.trim();
      renderCategories(allData);
    }

    document.getElementById('searchInput').addEventListener('input', handleSearch);

    Promise.all([loadConfig(), loadData()]);
  </script>
</body>
</html>
