<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .status-bar {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.9rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
    }
    .status-label {
      color: var(--text-muted);
    }
    .status-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      color: #38bdf8;
    }
    .mini-btn {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 6px;
      padding: 0.2rem 0.5rem;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mini-btn:hover {
      background: rgba(59, 130, 246, 0.3);
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 2rem;
      text-align: center;
    }
    .grid {
      width: 100%;
      max-width: 760px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }
    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    .pwd-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin: 1rem 0 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pwd-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .pwd-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: 0.05em;
    }
    .pwd-none {
      font-size: 0.95rem;
      font-weight: 600;
      color: #34d399;
    }
    .btn-group {
      display: flex;
      gap: 0.75rem;
    }
    .btn {
      flex: 1;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
      display: inline-block;
    }
    .btn:hover {
      background: var(--primary-hover);
    }
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--success);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">当前时间：</span>
      <span class="status-value" id="clock">加载中...</span>
    </div>
    <div class="status-item">
      <span class="status-label">当前 IP：</span>
      <span class="status-value" id="ip-text">获取中...</span>
      <button class="mini-btn" onclick="copyCurrentIP()">复制</button>
      <button class="mini-btn" onclick="fetchIP()">刷新</button>
    </div>
  </div>

  <h1>工具</h1>

  <div class="grid">
    <!-- 卡片 1：JiYuTrainer -->
    <div class="card">
      <div>
        <div class="card-title">JiYuTrainer</div>
        <div class="pwd-box">
          <span class="pwd-label">访问密码</span>
          <span class="pwd-code">9qbc</span>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="copyAndGo('9qbc', 'https://wwboc.lanzoum.com/im05d1zuwxda')">
          复制密码并前往下载
        </button>
      </div>
    </div>

    <!-- 卡片 2：CS 1.6 下载站 -->
    <div class="card">
      <div>
        <div class="card-title">CS 1.6 下载站</div>
        <div class="pwd-box">
          <span class="pwd-label">下载方式</span>
          <span class="pwd-none">游民星空直达 · 无需密码</span>
        </div>
      </div>
      <div class="btn-group">
        <a class="btn" href="https://down.gamersky.com/pc/200610/6821.shtml" target="_blank" rel="noopener noreferrer">
          前往下载
        </a>
      </div>
    </div>
  </div>

  <div id="toast">已复制</div>

  <script>
    let currentIP = '';

    function updateClock() {
      const now = new Date();
      const str = now.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        weekday: 'short',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
      document.getElementById('clock').textContent = str;
    }
    updateClock();
    setInterval(updateClock, 1000);

    async function fetchIP() {
      const ipEl = document.getElementById('ip-text');
      ipEl.textContent = '获取中...';
      const sources = [
        async () => {
          const r = await fetch('https://api.ip.sb/geoip');
          const d = await r.json();
          const loc = [d.country, d.city].filter(Boolean).join(' · ');
          return { ip: d.ip, display: loc ? `${d.ip} (${loc})` : d.ip };
        },
        async () => {
          const r = await fetch('https://ipapi.co/json/');
          const d = await r.json();
          const loc = [d.country_name, d.city].filter(Boolean).join(' · ');
          return { ip: d.ip, display: loc ? `${d.ip} (${loc})` : d.ip };
        },
        async () => {
          const r = await fetch('https://api.ipify.org?format=json');
          const d = await r.json();
          return { ip: d.ip, display: d.ip };
        }
      ];

      for (const fn of sources) {
        try {
          const res = await fn();
          if (res && res.ip) {
            currentIP = res.ip;
            ipEl.textContent = res.display;
            return;
          }
        } catch (e) {}
      }
      ipEl.textContent = '获取失败';
    }
    fetchIP();

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function copyText(text, msg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(msg));
      } else {
        const input = document.createElement('input');
        input.value = text;
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        document.body.removeChild(input);
        showToast(msg);
      }
    }

    function copyCurrentIP() {
      if (!currentIP) {
        showToast('暂无可复制的 IP');
        return;
      }
      copyText(currentIP, 'IP 已复制到剪贴板');
    }

    function copyAndGo(pwd, url) {
      copyText(pwd, '提取码 ' + pwd + ' 已复制，正在跳转...');
      setTimeout(() => {
        window.open(url, '_blank', 'noopener,noreferrer');
      }, 350);
    }
  </script>
</body>
</html>
